# ==========================================
  # GIAI ĐOẠN 2 (CD): CHỈ DEPLOY KHI MERGE VÀO MASTER
  # ==========================================
  cd-deploy:
    name: Deploy to TinoHost
    needs: ci-test # Bắt buộc ci-test phải PASS (xanh) thì mới chạy bước này
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Lấy thêm 1 commit trước đó để kiểm tra xem composer.lock có đổi không

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Vue Production
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Merge Frontend into Laravel
        run: |
          rm -rf public/assets
          cp -r frontend/dist/assets public/assets
          mkdir -p resources/views
          cp frontend/dist/index.html resources/views/app.blade.php

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, fileinfo, gd, zip

      - name: Install Composer (Production - No Dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Zip vendor directory
        run: zip -rq vendor.zip vendor/

      - name: Sync files to TinoHost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp          # Đổi từ ftps sang ftp để tránh rớt gói tin TLSSocket trên shared host
          max-connections: 2     # Giới hạn 2 luồng để TinoHost không chặn IP
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            frontend/**
            tests/**
            .env
            storage/**
            vendor/**            # Loại trừ thư mục vendor/ gốc, chỉ đẩy file vendor.zip